<!--

Process Name: AI Assistant WebGUI - Chat Tab
=============================================================================
Description:
  Клиентский интерфейс выделенной вкладки диалога с ИИ (tab-chat).
  Обеспечивает интеллектуальный диалог с контекстом выбранной рабочей
  области и верифицированными цитатами источников через контур /api/v1/ask.

File: index.html
Package: apps/ai_assistant/api/webgui/tab_chat
Author: hypo69
Copyright: © 2026 hypo69
Updated: 2026-11-19 20:59:00
=============================================================================

<div class="container-fluid p-3 d-flex flex-column h-100" id="tab-chat-container">
<!-- Верхняя панель заголовка и контекста рабочей области -->
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3" id="tab-chat-header-bar">
<div>
<h4 class="fw-bold mb-1 d-flex align-items-center gap-2" id="tab-chat-title-wrap">
<i class="bi bi-chat-square-text-fill text-primary" id="tab-chat-icon"></i>
<span data-i18n="tabs.chat" id="tab-chat-heading-title">{{tabs.chat}}</span>
</h4>
<div class="small text-muted" data-i18n="workspace.chatHeaderDesc" id="tab-chat-heading-subtitle">{{workspace.chatHeaderDesc}}</div>
</div>
<div class="d-flex flex-wrap align-items-center gap-2" id="tab-chat-header-actions">
<!-- Индикатор активной рабочей области -->
<div class="badge bg-body-secondary text-body border border-secondary-subtle d-flex align-items-center gap-1.5 py-1.5 px-2.5 rounded-pill shadow-xs" data-i18n-title="workspace.activeWorkspaceLabel" id="chat-active-ws-badge" title="{{workspace.activeWorkspaceLabel}}">
<i class="bi bi-folder2-open text-primary"></i>
<span class="fw-semibold" id="chat-active-ws-name">default</span>
</div>
<!-- Статус готовности / генерации -->
<span class="text-secondary small fw-medium" data-i18n="workspace.chatReadyStatus" id="ws-chat-status">{{workspace.chatReadyStatus}}</span>
<!-- Кнопка очистки истории чата -->
<button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 py-1 px-2.5 shadow-xs" data-i18n-title="workspace.chatClearTitle" id="ws-chat-clear-btn" title="{{workspace.chatClearTitle}}" type="button">
<i class="bi bi-trash3"></i>
<span data-i18n="workspace.chatClearBtn" id="ws-chat-clear-btn-text">{{workspace.chatClearBtn}}</span>
</button>
</div>
</div>
<!-- Главная карточка окна диалога -->
<div class="card bg-body border-secondary-subtle shadow-sm flex-grow-1 d-flex flex-column mb-3" data-panel-id="panel-chat" id="panel-chat">
<!-- Окно отображения сообщений диалога -->
<div class="card-body p-3 overflow-y-auto flex-grow-1 d-flex flex-column" id="ws-chat-response-window" style="min-height: 400px; max-height: calc(100vh - 280px);">
<!-- Стартовое пустое состояние (Empty State) -->
<div class="text-center my-auto py-5" id="ws-chat-empty-state">
<i class="bi bi-chat-square-dots fs-1 d-block mb-3 text-primary opacity-50" id="ws-chat-empty-icon"></i>
<div class="fw-bold fs-5 mb-1" data-i18n="workspace.chatEmptyTitle" id="ws-chat-empty-title">{{workspace.chatEmptyTitle}}</div>
<div class="small text-secondary mb-4 max-w-600 mx-auto" data-i18n="workspace.chatEmptyDesc" id="ws-chat-empty-desc">{{workspace.chatEmptyDesc}}</div>
<!-- Быстрые примеры запросов (Quick Prompts) -->
<div class="d-flex flex-wrap justify-content-center gap-2 max-w-700 mx-auto" id="chat-quick-prompts">
<button class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-3 chat-prompt-chip" id="chat-prompt-chip-1" type="button">
<i class="bi bi-lightbulb text-warning me-1"></i>
<span data-i18n="workspace.chatPrompt1" id="chat-prompt-span-1">{{workspace.chatPrompt1}}</span>
</button>
<button class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-3 chat-prompt-chip" id="chat-prompt-chip-2" type="button">
<i class="bi bi-diagram-2 text-info me-1"></i>
<span data-i18n="workspace.chatPrompt2" id="chat-prompt-span-2">{{workspace.chatPrompt2}}</span>
</button>
<button class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-3 chat-prompt-chip" id="chat-prompt-chip-3" type="button">
<i class="bi bi-git text-danger me-1"></i>
<span data-i18n="workspace.chatPrompt3" id="chat-prompt-span-3">{{workspace.chatPrompt3}}</span>
</button>
</div>
</div>
<!-- Контейнер динамических пузырей сообщений -->
<div class="d-flex flex-column gap-3 w-100" id="ws-chat-messages"></div>
</div>
<!-- Подвал карточки с полем ввода и кнопками под полем ввода -->
<div class="card-footer bg-body-tertiary p-3 border-top border-secondary-subtle" id="panel-chat-footer">
<div class="d-flex flex-column gap-2 mb-2" id="ws-chat-input-group">
<textarea class="form-control bg-body text-body w-100" data-i18n-placeholder="workspace.chatInputPlaceholder" id="ws-chat-input" onkeydown="if(event.key==='Enter'&amp;&amp;!event.shiftKey){event.preventDefault();window.sendChatMessage&amp;&amp;window.sendChatMessage();return false;}" placeholder="{{workspace.chatInputPlaceholder}}" rows="4"></textarea>
<div class="chat-input-actions d-flex flex-wrap align-items-center gap-2" id="ws-chat-actions-row">
<button class="btn btn-primary px-4 fw-semibold d-inline-flex align-items-center gap-1.5" data-i18n-title="workspace.chatSendTitle" id="ws-chat-send-btn" onclick="sendChatMessage()" title="{{workspace.chatSendTitle}}" type="button">
<i class="bi bi-send-fill" id="ws-chat-send-icon"></i>
<span data-i18n="workspace.chatSendBtn" id="ws-chat-send-btn-text">{{workspace.chatSendBtn}}</span>
</button>
<button class="btn btn-outline-primary px-3 fw-semibold d-inline-flex align-items-center gap-1.5" data-i18n-title="workspace.chatAddTaskTitle" id="chat-add-task-btn" onclick="addTaskFromChat()" title="{{workspace.chatAddTaskTitle}}" type="button">
<i class="bi bi-clipboard2-check-fill" id="chat-add-task-icon"></i>
<span data-i18n="workspace.chatAddTaskBtn" id="chat-add-task-btn-text">{{workspace.chatAddTaskBtn}}</span>
</button>
<button class="btn btn-outline-success px-3 fw-semibold d-inline-flex align-items-center gap-1.5" data-i18n-title="workspace.chatAddFactTitle" id="chat-add-fact-btn" onclick="addFactFromChat()" title="{{workspace.chatAddFactTitle}}" type="button">
<i class="bi bi-plus-circle-fill" id="chat-add-fact-icon"></i>
<span data-i18n="workspace.chatAddFactBtn" id="chat-add-fact-btn-text">{{workspace.chatAddFactBtn}}</span>
</button>
</div>
</div>
<!-- Подсказка по горячим клавишам и бейдж режима -->
<div class="d-flex flex-wrap justify-content-between align-items-center small text-muted gap-2" id="chat-input-hints-row">
<div class="d-flex align-items-center gap-1.5" id="chat-shortcut-hint-wrap">
<i class="bi bi-keyboard text-secondary" id="chat-shortcut-hint-icon"></i>
<span data-i18n="workspace.chatShortcutHint" id="chat-shortcut-hint-text">{{workspace.chatShortcutHint}}</span>
</div>
<div class="d-flex align-items-center gap-2" id="chat-badges-wrap">
<span class="badge bg-primary-subtle text-primary border border-primary-subtle" data-i18n="workspace.chatRagBadge" id="chat-rag-badge">{{workspace.chatRagBadge}}</span>
<span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle" data-i18n="workspace.chatSourcesBadge" id="chat-sources-badge">{{workspace.chatSourcesBadge}}</span>
</div>
</div>
</div>
</div>
</div>
