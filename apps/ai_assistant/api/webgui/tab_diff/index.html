  Позволяет выбрать сохранение из понятного списка, увидеть затронутые
  документы, наглядно просмотреть добавленный и удалённый текст и получить
  пояснение простыми словами от ИИ.

<div class="container-fluid p-3">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
    <div>
      <h4 class="fw-bold mb-1 d-flex align-items-center gap-2">
        <span class="fs-5">⚖️</span>
        <span data-i18n="tabs.diff" id="tab-diff-heading-text">{{tabs.diff}}</span>
      </h4>
      <div class="small text-muted" data-i18n="ui.diff.txt_f00b92bd" id="diff-div-f00b92bd">{{ui.diff.txt_f00b92bd}}</div>
    </div>
    <div class="d-flex align-items-center flex-wrap gap-2">
      <select class="form-select form-select-sm diff-version-select" data-i18n-title="ui.diff.selectVersionTitle" id="diff-version-select" title="{{ui.diff.selectVersionTitle}}">
        <option data-i18n="ui.diff.loadingVersions" id="diff-opt-loading" value="">{{ui.diff.loadingVersions}}</option>
      </select>
      <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1" id="diff-load-btn" type="button">
        <i class="bi bi-arrow-clockwise"></i>
        <span data-i18n="ui.diff.txt_1bca034f" id="diff-span-1bca034f">{{ui.diff.txt_1bca034f}}</span>
      </button>
      <button class="btn btn-sm btn-warning d-flex align-items-center gap-1" id="diff-ai-insights-btn" type="button">
        <i class="bi bi-stars"></i>
        <span data-i18n="ui.diff.txt_42b34c89" id="diff-span-42b34c89">{{ui.diff.txt_42b34c89}}</span>
      </button>
    </div>
  </div>

  <!-- Панель недавно изменённых документов -->
  <div class="card shadow-sm border mb-3" data-panel-id="panel-diff-stats" id="panel-diff-stats">
    <div class="card-header bg-body-tertiary d-flex align-items-center justify-content-between py-2 px-3">
      <div class="fw-semibold small d-flex align-items-center gap-2">
        <i class="bi bi-folder2-open text-info"></i>
        <span data-i18n="ui.diff.txt_3af9e925" id="diff-span-3af9e925">{{ui.diff.txt_3af9e925}}</span>
      </div>
      <span class="badge bg-secondary-subtle text-secondary border" data-i18n="ui.diff.txt_e9e5145e" id="diff-stats-count-badge">{{ui.diff.txt_e9e5145e}}</span>
    </div>
    <div class="card-body p-2" id="diff-stats-body">
      <div class="text-center py-2 text-muted small" data-i18n="ui.diff.txt_c8a11502" id="diff-div-c8a11502">{{ui.diff.txt_c8a11502}}</div>
    </div>
  </div>

  <!-- Карточка пояснения от ИИ -->
  <div class="card shadow-sm border border-warning-subtle mb-3 d-none" id="diff-ai-card">
    <div class="card-header bg-warning-subtle text-warning-emphasis fw-semibold small d-flex align-items-center justify-content-between py-2 px-3">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-stars"></i>
        <span data-i18n="ui.diff.txt_7cd8b0fa" id="diff-span-7cd8b0fa">{{ui.diff.txt_7cd8b0fa}}</span>
      </div>
      <button class="btn-close btn-sm" data-i18n-title="common.close" id="diff-ai-close-btn" title="{{common.close}}" type="button"></button>
    </div>
    <div class="card-body p-3">
      <div class="small mb-2" id="diff-ai-summary-text"></div>
      <div class="d-flex flex-wrap gap-1" id="diff-ai-entities-box"></div>
    </div>
  </div>

  <!-- Область наглядного просмотра правок -->
  <div class="card shadow-sm border mb-3">
    <div class="card-header bg-body-tertiary d-flex align-items-center justify-content-between flex-wrap gap-2 py-2 px-3">
      <div class="d-flex align-items-center gap-2 min-w-0">
        <i class="bi bi-file-earmark-check text-primary"></i>
        <span class="small fw-semibold text-truncate" data-i18n="ui.diff.txt_95e4aae4" id="diff-header-title">{{ui.diff.txt_95e4aae4}}</span>
        <span class="badge bg-primary-subtle text-primary border" data-i18n="ui.diff.txt_a4377dac" id="diff-status-indicator">{{ui.diff.txt_a4377dac}}</span>
      </div>
      <div class="d-flex align-items-center flex-wrap gap-3">
        <div class="form-check form-switch mb-0 small">
          <input checked class="form-check-input" id="diff-only-changes-toggle" type="checkbox"/>
          <label class="form-check-label" data-i18n="ui.diff.onlyChanges" for="diff-only-changes-toggle" id="diff-only-changes-label">{{ui.diff.onlyChanges}}</label>
        </div>
        <div class="btn-group btn-group-sm" role="group">
          <button class="btn btn-outline-secondary active" id="diff-mode-friendly-btn" type="button">
            <i class="bi bi-card-checklist"></i>
            <span data-i18n="ui.diff.modeFriendly" id="diff-mode-friendly-text">{{ui.diff.modeFriendly}}</span>
          </button>
          <button class="btn btn-outline-secondary" id="diff-mode-raw-btn" type="button">
            <i class="bi bi-code-slash"></i>
            <span data-i18n="ui.diff.modeRaw" id="diff-mode-raw-text">{{ui.diff.modeRaw}}</span>
          </button>
        </div>
      </div>
    </div>
    <div class="card-body p-3 friendly-diff-container" id="diff-friendly-view">
      <div class="text-center py-4 text-muted small" data-i18n="ui.diff.txt_b6d72f5e" id="diff-empty-placeholder">{{ui.diff.txt_b6d72f5e}}</div>
    </div>
    <div class="card-body p-0 d-none" id="diff-raw-wrapper">
      <pre class="m-0 p-3 bg-body-tertiary text-body font-monospace border-0 pre-scrollable-480" id="diff-code-pre"><span data-i18n="ui.diff.txt_b6d72f5e" id="spn-ui-diff-txt-b6d72f5e">{{ui.diff.txt_b6d72f5e}}</span></pre>
    </div>
  </div>
</div>
