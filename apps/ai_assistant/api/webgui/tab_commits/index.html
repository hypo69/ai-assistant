<div class="container-fluid p-3">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
    <div>
      <h4 class="fw-bold mb-1 d-flex align-items-center gap-2">
        <span class="fs-5">📜</span>
        <span data-i18n="tabs.commits" id="tab-commits-heading-text">{{tabs.commits}}</span>
      </h4>
      <div class="small text-muted" data-i18n="ui.commits.txt_a8e8fb68" id="commits-div-a8e8fb68">{{ui.commits.txt_a8e8fb68}}</div>
    </div>
    <div class="d-flex align-items-center flex-wrap gap-2">
      <input class="form-control form-control-sm min-w-220" data-i18n-placeholder="placeholders.commits.ph_ef75ffc3" id="commits-search-input" placeholder="{{placeholders.commits.ph_ef75ffc3}}" type="text"/>
      <button class="btn btn-sm btn-primary d-flex align-items-center gap-1" id="commits-refresh-btn" type="button">
        <i class="bi bi-arrow-clockwise"></i>
        <span data-i18n="common.refresh" id="tab-commits-refresh-btn-text">{{common.refresh}}</span>
      </button>
    </div>
  </div>

  <!-- Быстрые фильтры по типу событий -->
  <div class="d-flex align-items-center flex-wrap gap-2 mb-3" id="commits-filter-bar" role="group">
    <button class="btn btn-sm btn-outline-secondary commits-filter-pill active d-inline-flex align-items-center gap-1" data-filter="all" id="commits-filter-all" type="button">
      <i class="bi bi-collection"></i>
      <span data-i18n="ui.commits.filterAll" id="commits-filter-all-text">{{ui.commits.filterAll}}</span>
    </button>
    <button class="btn btn-sm btn-outline-secondary commits-filter-pill d-inline-flex align-items-center gap-1" data-filter="docs" id="commits-filter-docs" type="button">
      <i class="bi bi-file-earmark-text"></i>
      <span data-i18n="ui.commits.filterDocs" id="commits-filter-docs-text">{{ui.commits.filterDocs}}</span>
    </button>
    <button class="btn btn-sm btn-outline-secondary commits-filter-pill d-inline-flex align-items-center gap-1" data-filter="auto" id="commits-filter-auto" type="button">
      <i class="bi bi-cpu"></i>
      <span data-i18n="ui.commits.filterAuto" id="commits-filter-auto-text">{{ui.commits.filterAuto}}</span>
    </button>
    <button class="btn btn-sm btn-outline-secondary commits-filter-pill d-inline-flex align-items-center gap-1" data-filter="notes" id="commits-filter-notes" type="button">
      <i class="bi bi-chat-left-text"></i>
      <span data-i18n="ui.commits.filterNotes" id="commits-filter-notes-text">{{ui.commits.filterNotes}}</span>
    </button>
  </div>

  <div class="card shadow-sm border mb-3" data-panel-id="panel-commits" id="panel-commits">
    <div class="card-header bg-body-tertiary d-flex align-items-center justify-content-between py-2 px-3">
      <div class="fw-semibold small d-flex align-items-center gap-2">
        <i class="bi bi-clock-history text-primary"></i>
        <span data-i18n="ui.commits.txt_b7ca8395" id="commits-span-b7ca8395">{{ui.commits.txt_b7ca8395}}</span>
      </div>
      <span class="badge bg-secondary-subtle text-secondary border" data-i18n="ui.commits.txt_8f8e2027" id="commits-count-badge">{{ui.commits.txt_8f8e2027}}</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 small">
          <thead class="table-light">
            <tr>
              <th class="col-w-130" data-i18n="ui.commits.txt_59d5b10c" id="commits-th-59d5b10c">{{ui.commits.txt_59d5b10c}}</th>
              <th class="col-w-170" data-i18n="ui.commits.txt_8cdd8bb7" id="commits-th-8cdd8bb7">{{ui.commits.txt_8cdd8bb7}}</th>
              <th class="col-w-160" data-i18n="ui.commits.txt_7c7d054b" id="commits-th-7c7d054b">{{ui.commits.txt_7c7d054b}}</th>
              <th data-i18n="ui.commits.txt_37157665" id="commits-th-37157665">{{ui.commits.txt_37157665}}</th>
              <th class="col-w-150 text-end" data-i18n="ui.commits.txt_fb3df31b" id="commits-th-fb3df31b">{{ui.commits.txt_fb3df31b}}</th>
            </tr>
          </thead>
          <tbody id="commits-table-body">
            <tr>
              <td class="text-center py-4 text-muted" colspan="5">
                <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                <div data-i18n="ui.commits.txt_f079b253" id="commits-div-f079b253">{{ui.commits.txt_f079b253}}</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
