<div class="container-fluid p-3" id="tab-calendar-container">
<!-- Верхняя строка заголовка и действий -->
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
<div>
<h4 class="fw-bold mb-1 d-flex align-items-center gap-2">
<span class="fs-4">📅</span>
<span data-i18n="ui.calendar.title" id="calendar-span-title">{{ui.calendar.title}}</span>
</h4>
<div class="small text-muted" data-i18n="ui.calendar.subtitle" id="calendar-div-subtitle">{{ui.calendar.subtitle}}</div>
</div>
<div class="d-flex flex-wrap align-items-center gap-2">
<span class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2 shadow-sm d-flex align-items-center gap-1.5" id="calendar-account-badge">
<i class="bi bi-google"></i>
<span data-i18n="ui.calendar.connected" id="calendar-account-email">{{ui.calendar.connected}}</span>
</span>
<button class="btn btn-sm btn-primary d-flex align-items-center gap-1.5 shadow-sm fw-semibold" id="btn-calendar-create" type="button">
<i class="bi bi-calendar-plus"></i>
<span data-i18n="ui.calendar.btn_create" id="calendar-span-create">{{ui.calendar.btn_create}}</span>
</button>
<button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1.5 shadow-sm" data-i18n-title="calendar.refreshTitle" id="btn-calendar-refresh" title="{{calendar.refreshTitle}}" type="button">
<i class="bi bi-arrow-clockwise"></i>
<span class="d-none d-sm-inline" data-i18n="ui.calendar.btn_refresh" id="calendar-span-refresh">{{ui.calendar.btn_refresh}}</span>
</button>
</div>
</div>
<!-- Панель фильтрации и выбора периода -->
<div class="card shadow-sm border mb-3">
<div class="card-body py-2 px-3">
<div class="row g-2 align-items-center justify-content-between">
<div class="col-12 col-md-6">
<div class="input-group input-group-sm">
<span class="input-group-text bg-body-tertiary border-end-0">
<i class="bi bi-search text-muted"></i>
</span>
<input class="form-control border-start-0" data-i18n-placeholder="placeholders.calendar.txt_0b348354" id="calendar-search-input" placeholder="{{placeholders.calendar.txt_0b348354}}" type="text"/>
<button class="btn btn-outline-secondary" data-i18n-title="calendar.clearSearchTitle" id="btn-calendar-search-clear" title="{{calendar.clearSearchTitle}}" type="button">
<i class="bi bi-x-lg"></i>
</button>
</div>
</div>
<div class="col-12 col-md-6 d-flex justify-content-md-end gap-1">
<div class="btn-group btn-group-sm" role="group">
<input checked="" class="btn-check" id="cal-days-7" name="calendar-days" type="radio" value="7"/>
<label class="btn btn-outline-primary" data-i18n="ui.calendar.days_7" for="cal-days-7" id="cal-label-days-7">{{ui.calendar.days_7}}</label>
<input class="btn-check" id="cal-days-14" name="calendar-days" type="radio" value="14"/>
<label class="btn btn-outline-primary" data-i18n="ui.calendar.days_14" for="cal-days-14" id="cal-label-days-14">{{ui.calendar.days_14}}</label>
<input class="btn-check" id="cal-days-30" name="calendar-days" type="radio" value="30"/>
<label class="btn btn-outline-primary" data-i18n="ui.calendar.days_30" for="cal-days-30" id="cal-label-days-30">{{ui.calendar.days_30}}</label>
</div>
</div>
</div>
</div>
</div>
<!-- Список событий -->
<div id="calendar-events-container">
<div class="d-flex justify-content-center py-5" id="calendar-loading-spinner">
<div class="spinner-border text-primary" role="status">
<span class="visually-hidden" data-i18n="common.loading" id="spn-common-loading">{{common.loading}}</span>
</div>
</div>
<div class="row g-3" id="calendar-events-list"></div>
<div class="text-center py-5 d-none" id="calendar-empty-state">
<i class="bi bi-calendar-x fs-1 text-muted d-block mb-2"></i>
<h6 class="text-muted" data-i18n="ui.calendar.no_events" id="cal-h6-no-events">{{ui.calendar.no_events}}</h6>
<p class="small text-muted mb-0" data-i18n="ui.calendar.create_hint" id="cal-p-create-hint">{{ui.calendar.create_hint}}</p>
</div>
</div>
</div>
<!-- Модальное окно создания события -->
<div aria-hidden="true" class="modal fade" id="modal-calendar-create" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content border-0 shadow">
<div class="modal-header border-bottom">
<h5 class="modal-title fw-bold d-flex align-items-center gap-2">
<i class="bi bi-calendar-plus text-primary"></i>
<span data-i18n="ui.calendar.modal_create_title" id="cal-span-modal-create-title">{{ui.calendar.modal_create_title}}</span>
</h5>
<button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body">
<form id="form-calendar-create">
<div class="mb-3">
<label class="form-label small fw-semibold" data-i18n="ui.calendar.label_summary" id="cal-label-summary">{{ui.calendar.label_summary}}</label>
<input class="form-control form-control-sm" data-i18n-placeholder="placeholders.calendar.txt_b2f089dd" id="cal-create-summary" placeholder="{{placeholders.calendar.txt_b2f089dd}}" required="" type="text"/>
</div>
<div class="row g-2 mb-3">
<div class="col-6">
<label class="form-label small fw-semibold" data-i18n="ui.calendar.label_start" id="cal-label-start">{{ui.calendar.label_start}}</label>
<input class="form-control form-control-sm" id="cal-create-start" required="" type="datetime-local"/>
</div>
<div class="col-6">
<label class="form-label small fw-semibold" data-i18n="ui.calendar.label_end" id="cal-label-end">{{ui.calendar.label_end}}</label>
<input class="form-control form-control-sm" id="cal-create-end" required="" type="datetime-local"/>
</div>
</div>
<div class="mb-3">
<label class="form-label small fw-semibold" data-i18n="ui.calendar.label_location" id="cal-label-location">{{ui.calendar.label_location}}</label>
<input class="form-control form-control-sm" data-i18n-placeholder="placeholders.calendar.txt_bd384c90" id="cal-create-location" placeholder="{{placeholders.calendar.txt_bd384c90}}" type="text"/>
</div>
<div class="mb-3">
<label class="form-label small fw-semibold" data-i18n="ui.calendar.label_attendees" id="cal-label-attendees">{{ui.calendar.label_attendees}}</label>
<input class="form-control form-control-sm" id="cal-create-attendees" placeholder="colleague@example.com, manager@example.com" type="text"/>
</div>
<div class="mb-2">
<label class="form-label small fw-semibold" data-i18n="ui.calendar.label_desc" id="cal-label-desc">{{ui.calendar.label_desc}}</label>
<textarea class="form-control form-control-sm" data-i18n-placeholder="placeholders.calendar.txt_9f44ec10" id="cal-create-desc" placeholder="{{placeholders.calendar.txt_9f44ec10}}" rows="3"></textarea>
</div>
<div class="alert alert-danger d-none py-1 small mb-0 mt-2" id="cal-create-error"></div>
</form>
</div>
<div class="modal-footer border-top">
<button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal" data-i18n="ui.calendar.btn_cancel" id="cal-btn-modal-cancel" type="button">{{ui.calendar.btn_cancel}}</button>
<button class="btn btn-sm btn-primary" id="btn-calendar-save-event" type="button">
<i class="bi bi-check-lg me-1"></i> <span data-i18n="ui.calendar.btn_save" id="cal-span-btn-save">{{ui.calendar.btn_save}}</span>
</button>
</div>
</div>
</div>
</div>
