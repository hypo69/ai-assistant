<div class="container-fluid p-3" id="tab-contacts-container">

    <div class="d-flex flex-wrap align-items-center gap-2">

        <span data-i18n="contacts.btn_import_fakes" id="contacts-span-import-fakes">{{contacts.btn_import_fakes}}</span>

        <span class="d-none d-sm-inline" data-i18n="ui.contacts.btn_refresh" id="contacts-span-refresh">{{ui.contacts.btn_refresh}}</span>
      </button>
    </div>
  </div>

  <!-- Поисковая панель -->
  <div class="card shadow-sm border mb-3">
    <div class="card-body py-2 px-3">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-6 col-lg-5">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-body-tertiary border-end-0">
              <i class="bi bi-search text-muted"></i>
            </span>

        </div>
        <div class="col-12 col-md-6 col-lg-7 text-md-end">

    </div>

    </div>

      <p class="small text-muted mb-0" data-i18n="ui.contacts.create_hint" id="cnt-p-create-hint">{{ui.contacts.create_hint}}</p>

  </div>

<!-- Модальное окно добавления контакта -->

            </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small fw-semibold" data-i18n="ui.contacts.label_phone" id="cnt-label-phone">{{ui.contacts.label_phone}}</label>
              <input class="form-control form-control-sm" id="cnt-create-phone" placeholder="+7 (999) 000-00-00" type="tel"/>
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold" data-i18n="ui.contacts.label_email" id="cnt-label-email">{{ui.contacts.label_email}}</label>
              <input class="form-control form-control-sm" id="cnt-create-email" placeholder="ivan@example.com" type="email"/>

          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small fw-semibold" data-i18n="ui.contacts.label_org" id="cnt-label-org">{{ui.contacts.label_org}}</label>

          <div class="mb-2">
            <label class="form-label small fw-semibold" data-i18n="ui.contacts.label_notes" id="cnt-label-notes">{{ui.contacts.label_notes}}</label>
            <textarea class="form-control form-control-sm" data-i18n-placeholder="placeholders.contacts.txt_565a58ba" id="cnt-create-notes" placeholder="{{placeholders.contacts.txt_565a58ba}}" rows="2"></textarea>
          </div>
          <div class="alert alert-danger d-none py-1 small mb-0 mt-2" id="contacts-create-error"></div>

      </div>

        <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal" data-i18n="ui.contacts.btn_cancel" id="cnt-btn-modal-cancel" type="button">{{ui.contacts.btn_cancel}}</button>

        </button>

    </div>
  </div>
</div>
