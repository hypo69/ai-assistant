# =============================================================================
# Process Name: AI-Windows-Admin Common WYSIWYG Editor - Rust Wasm Crate Config
# =============================================================================
# Description:
#   Конфигурация Rust крейта для компиляции полнофункционального ядра
#   WYSIWYG-редактора файлов (Markdown, HTML, BBCode, Text, Document Tree)
#   в WebAssembly (wasm32-unknown-unknown).
#
# File: Cargo.toml
# Project: ai-windows-admin
# Package: apps.common.webgui.components.editor-files
# Author: hypo69
# Copyright: © 2026 hypo69
