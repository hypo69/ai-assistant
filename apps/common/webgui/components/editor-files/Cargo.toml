[package]
name = "editor-files-wasm-core"
version = "1.0.0"
edition = "2021"
authors = ["hypo69"]
description = "Клиентское WebAssembly ядро для универсального компонента editor-files (WYSIWYG / Markdown / Text)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
