<div class="ai-modal-overlay d-none" id="ai-modal-overlay">
<div class="ai-modal-card shadow-lg p-3">
<div class="ai-modal-header d-flex justify-content-between align-items-center pb-2 border-bottom">
<h5 class="mb-0 text-info fw-bold" data-i18n="aiModal.processPassport" id="ai-modal-header-title">{{aiModal.processPassport}}</h5>
<button aria-label="{{common.close}}" class="btn-close" data-i18n-aria-label="common.close" id="btn-close-ai-modal" type="button"></button>
</div>
<div class="ai-modal-body py-3" id="ai-modal-body-content">
<!-- Динамический контент заполняется через AIModalDialog.open() -->
</div>
<div class="ai-modal-footer d-flex justify-content-between pt-2 border-top">
<div class="d-flex gap-2" id="ai-modal-actions"></div>
<button class="btn btn-sm btn-secondary" data-i18n="aiModal.closeBtn" id="btn-dismiss-ai-modal" type="button">{{aiModal.closeBtn}}</button>
</div>
</div>
</div>
