  предпросмотром Markdown, встроенным видеоплеером (HTML5 Video), аудиоплеером,
  нумерацией строк, статистикой символов/строк, сохранением с фиксацией в Git (Ctrl+S)
  и открытием файлов в системных приложениях.

<link href="/html/tab_file_editor/style.css?v=20261119_v1" rel="stylesheet"/>
<div class="wasm-editor-shell shadow-sm d-flex flex-column h-100" id="wasm-file-editor-root">
<!-- 1. Верхняя полоса открытых файловых вкладок (VS Code Tabs Bar) -->
<div class="wasm-editor-tabs-bar d-flex align-items-center justify-content-between px-2" id="fe-open-tabs-bar-wrapper">
<div class="d-flex align-items-center gap-1 overflow-x-auto flex-grow-1" id="fe-open-tabs-bar">
<!-- Динамически заполняется вкладками открытых файлов -->
</div>
<div class="d-flex align-items-center gap-1 ms-2">
<button class="btn btn-xs btn-outline-secondary py-0 px-1.5" data-i18n-title="fileEditor.newFileTitle" id="fe-btn-new-file" title="{{fileEditor.newFileTitle}}" type="button">
<i class="bi bi-plus-lg"></i>
</button>
<button class="btn btn-xs btn-outline-secondary py-0 px-1.5" data-i18n-title="fileEditor.closeAllTitle" id="fe-btn-close-all" title="{{fileEditor.closeAllTitle}}" type="button">
<i class="bi bi-x-square"></i>
</button>
</div>
</div>
<!-- 2. Подшапка активного файла и панель инструментов (стиль Быстрого редактора) -->
<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 px-3 py-1.5 bg-body-tertiary border-bottom border-subtle" id="fe-active-file-toolbar">
<div class="d-flex align-items-center gap-2 overflow-hidden me-2">
<i class="bi bi-file-earmark-code text-primary fs-5" id="fe-active-file-icon"></i>
<div>
<div class="fw-bold text-truncate small" data-i18n="fileEditor.noFileSelected" id="fe-active-file-name">{{fileEditor.noFileSelected}}</div>
<div class="font-size-75 text-muted font-monospace text-truncate" id="fe-active-file-path">---</div>
</div>
</div>
<!-- Режимы Редактор / Предпросмотр (для Markdown и др.) + Действия -->
<div class="d-flex align-items-center gap-2 flex-wrap ms-auto">
<!-- Переключение направления текста (LTR / RTL) -->
<div class="btn-group btn-group-sm" id="fe-direction-group" role="group">
<button class="btn btn-sm btn-outline-secondary active py-0.5 px-2" data-dir="ltr" data-i18n-title="fileEditor.directionLtrTitle" id="fe-btn-dir-ltr" title="{{fileEditor.directionLtrTitle}}" type="button">
<i class="bi bi-text-left"></i>
<span class="d-none d-sm-inline">LTR</span>
</button>
<button class="btn btn-sm btn-outline-secondary py-0.5 px-2" data-dir="rtl" data-i18n-title="fileEditor.directionRtlTitle" id="fe-btn-dir-rtl" title="{{fileEditor.directionRtlTitle}}" type="button">
<i class="bi bi-text-right"></i>
<span class="d-none d-sm-inline">RTL</span>
</button>
</div>
<!-- Режимы: Редактор / Вид/Редактор / Вид -->
<div class="btn-group btn-group-sm d-none" id="fe-view-mode-group" role="group">
<button class="btn btn-sm btn-outline-primary active py-0.5 px-2" data-i18n-title="ide.editorTabCodeTitle" id="fe-tab-mode-code" title="{{ide.editorTabCodeTitle}}" type="button">
<i class="bi bi-pencil me-1"></i><span data-i18n="ide.editorTabCode" id="fe-mode-code-text">{{ide.editorTabCode}}</span>
</button>
<button class="btn btn-sm btn-outline-primary py-0.5 px-2" data-i18n-title="ide.editorTabSplitTitle" id="fe-tab-mode-split" title="{{ide.editorTabSplitTitle}}" type="button">
<i class="bi bi-layout-split me-1"></i><span data-i18n="ide.editorTabSplit" id="fe-mode-split-text">{{ide.editorTabSplit}}</span>
</button>
<button class="btn btn-sm btn-outline-primary py-0.5 px-2" data-i18n-title="ide.editorTabViewTitle" id="fe-tab-mode-preview" title="{{ide.editorTabViewTitle}}" type="button">
<i class="bi bi-eye me-1"></i><span data-i18n="ide.editorTabView" id="fe-mode-preview-text">{{ide.editorTabView}}</span>
</button>
</div>
<!-- Открыть в системном приложении -->
<button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 py-0.5 px-2" data-i18n-title="titles.ide.openInSystemEditor" id="fe-btn-system-open" title="{{titles.ide.openInSystemEditor}}" type="button">
<i class="bi bi-box-arrow-up-right"></i>
<span class="d-none d-md-inline" data-i18n="ide.openInSystem" id="fe-open-system-text">{{ide.openInSystem}}</span>
</button>
<!-- Сохранить изменения (Ctrl+S) -->
<button class="btn btn-sm btn-primary d-flex align-items-center gap-1.5 py-0.5 px-2.5 shadow-sm" data-i18n-title="fileEditor.saveTitle" id="fe-btn-save" title="{{fileEditor.saveTitle}}" type="button">
<i class="bi bi-floppy-fill"></i>
<span data-i18n="fileEditor.saveBtn" id="fe-save-btn-text">{{fileEditor.saveBtn}}</span>
</button>
<!-- Сохранить как... (Ctrl+Shift+S) -->
<button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1.5 py-0.5 px-2" data-i18n-title="fileEditor.saveAsTitle" id="fe-btn-save-as" title="{{fileEditor.saveAsTitle}}" type="button">
<i class="bi bi-save2"></i>
<span class="d-none d-lg-inline" data-i18n="fileEditor.saveAsBtn" id="fe-save-as-btn-text">{{fileEditor.saveAsBtn}}</span>
</button>
<!-- Сохранить все (Ctrl+Alt+S / Ctrl+K S) -->
<button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1.5 py-0.5 px-2" data-i18n-title="fileEditor.saveAllTitle" id="fe-btn-save-all" title="{{fileEditor.saveAllTitle}}" type="button">
<i class="bi bi-collection-fill"></i>
<span class="d-none d-lg-inline" data-i18n="fileEditor.saveAllBtn" id="fe-save-all-btn-text">{{fileEditor.saveAllBtn}}</span>
</button>
</div>
</div>
<!-- 3. Центральная область сцены редактора -->
<div class="position-relative flex-grow-1 d-flex flex-column overflow-hidden" id="fe-editor-body" style="min-height: 480px;">
<!-- Заглушка: Нет открытых вкладок -->
<div class="d-flex flex-column align-items-center justify-content-center flex-grow-1 p-4 text-center text-muted" id="fe-empty-state">
<i class="bi bi-code-square text-secondary fs-1 d-block mb-2"></i>
<h6 data-i18n="fileEditor.emptyTitle" id="fe-empty-title">{{fileEditor.emptyTitle}}</h6>
<p class="small text-muted mb-0" data-i18n="fileEditor.emptyHint" id="fe-empty-hint">{{fileEditor.emptyHint}}</p>
</div>
<!-- Заглушка: Бинарный файл -->
<div class="p-4 text-center text-muted d-none flex-column align-items-center justify-content-center flex-grow-1" id="fe-binary-notice">
<i class="bi bi-file-earmark-binary text-secondary fs-1 d-block mb-2"></i>
<h6 data-i18n="ide.binaryFileTitle" id="fe-binary-title">{{ide.binaryFileTitle}}</h6>
<p class="small text-muted mb-3" data-i18n="ide.binaryFileDesc" id="fe-binary-desc">{{ide.binaryFileDesc}}</p>
<button class="btn btn-sm btn-primary" data-i18n="ide.openInAssociatedApp" id="fe-btn-binary-open" type="button">{{ide.openInAssociatedApp}}</button>
</div>
<!-- Текстовый редактор с нумерацией строк -->
<div class="wasm-code-stage flex-grow-1 d-none" id="fe-text-stage">
<div class="wasm-line-gutter" id="fe-line-gutter">1</div>
<textarea class="wasm-code-textarea flex-grow-1" data-i18n-placeholder="fileEditor.editorPlaceholder" id="fe-code-textarea" placeholder="{{fileEditor.editorPlaceholder}}" spellcheck="false"></textarea>
<!-- Предпросмотр Markdown -->
<div class="border-start border-subtle p-3 bg-body overflow-auto flex-grow-1 d-none" id="fe-markdown-preview" style="min-height: 400px; font-size: 14px; line-height: 1.6;"></div>
</div>
<!-- Встроенный медиаплеер (Видео, Аудио, Изображения) без выхода за рамки технологии -->
<div class="p-3 d-none flex-column align-items-center justify-content-center flex-grow-1 overflow-auto bg-body-tertiary" id="fe-media-stage">
<div class="w-100 d-flex flex-column align-items-center justify-content-center" style="max-width: 960px;">
<!-- Встроенный видеоплеер HTML5 -->
<video class="w-100 rounded shadow-sm border border-subtle d-none" controls="" id="fe-media-video" playsinline="" style="max-height: 72vh; background-color: var(--surface-2);"></video>
<!-- Встроенный аудиоплеер HTML5 -->
<div class="w-100 p-4 rounded bg-body border border-subtle shadow-sm d-none" id="fe-media-audio-container">
<div class="d-flex align-items-center gap-2 mb-3">
<i class="bi bi-file-earmark-music text-primary fs-3"></i>
<div>
<div class="fw-semibold small" data-i18n="fileEditor.mediaAudioTitle" id="fe-media-audio-title">{{fileEditor.mediaAudioTitle}}</div>
<div class="font-size-75 text-muted" data-i18n="fileEditor.mediaAudioDesc" id="fe-media-audio-subtitle">{{fileEditor.mediaAudioDesc}}</div>
</div>
</div>
<audio class="w-100" controls="" id="fe-media-audio"></audio>
</div>
<!-- Встроенный просмотр изображений -->
<img alt="Preview" class="img-fluid rounded shadow-sm border border-subtle d-none" id="fe-media-image" style="max-height: 72vh; object-fit: contain;"/>
</div>
</div>
</div>
<!-- 4. Нижняя панель: коммит Git и статистика строк/символов (стиль Быстрого редактора) -->
<div class="p-2 bg-body-tertiary border-top border-subtle d-flex flex-wrap align-items-center justify-content-between gap-2" id="fe-bottom-bar">
<div class="d-flex align-items-center gap-2 flex-grow-1" style="max-width: 600px;">
<input autocomplete="off" class="form-control form-control-sm" data-i18n-placeholder="placeholders.ide.commitMsgOptional" id="fe-commit-msg-input" placeholder="{{placeholders.ide.commitMsgOptional}}" type="text"/>
</div>
<div class="d-flex align-items-center gap-3 font-size-75 text-muted ms-auto">
<span data-i18n="ide.editorStatsDefault" id="fe-editor-stats">{{ide.editorStatsDefault}}</span>
<span class="font-monospace" id="fe-editor-cursor">Ln 1, Col 1</span>
<span class="badge bg-secondary-subtle text-secondary" id="fe-save-status"></span>
</div>
</div>
</div>
