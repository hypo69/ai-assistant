Process Name: Microsoft 365 Web Interface - Outlook Tab View

Description:
  Веб-интерфейс вкладки управления почтовым клиентом Microsoft Outlook.
  Обеспечивает просмотр входящих сообщений, проверку статуса подключения
  и отправку новых писем.

File: index.html
Package: apps/microsoft/webgui/tab_outlook
Author: hypo69
Copyright: © 2026 hypo69
Updated: 2026-11-15 21:05:00

<div class="container-fluid py-3">
  <!-- Заголовок вкладки -->
  <div class="tab-header d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <span class="tab-header-icon fs-3">📬</span>
      <div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <h3 class="tab-header-title panel-header mb-0" data-i18n="ui.outlook.txt_header_title" id="outlook-h3-title">{{ui.outlook.txt_header_title}}</h3>
          <span class="badge bg-primary-subtle text-primary border" id="outlook-status-badge">Outlook 365</span>
        </div>
        <small class="tab-header-subtitle text-secondary" data-i18n="ui.outlook.txt_header_subtitle" id="outlook-small-subtitle">{{ui.outlook.txt_header_subtitle}}</small>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1.5 shadow-sm" data-i18n-title="titles.outlook.title_reload" id="btn-reload-outlook" title="{{titles.outlook.title_reload}}">
        <i class="bi bi-arrow-clockwise"></i>
        <span data-i18n="ui.outlook.txt_reload" id="outlook-span-reload">{{ui.outlook.txt_reload}}</span>
      </button>
    </div>
  </div>

  <!-- Верхние субвкладки: Входящие vs Написать -->
  <!-- Блок меню переключения панелей на вкладке. Выбранная панель добавляется в url -->
  <ul class="nav nav-tabs mb-3" id="outlookTabNav" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="btn btn-sm btn-outline-primary active d-flex align-items-center gap-1.5 py-1 px-2.5 rounded" data-bs-target="#tab-pane-outlook-inbox" data-bs-toggle="pill" data-i18n-title="outlook.subtabs.inboxTitle" data-panel-id="panel-outlook-inbox" id="nav-outlook-inbox-tab" role="tab" title="{{outlook.subtabs.inboxTitle}}" type="button">
        <i class="bi bi-inbox text-primary"></i>
        <span data-i18n="ui.outlook.txt_inbox" id="outlook-span-inbox">{{ui.outlook.txt_inbox}}</span>
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1.5 py-1 px-2.5 rounded" data-bs-target="#tab-pane-outlook-compose" data-bs-toggle="pill" data-i18n-title="outlook.subtabs.composeTitle" data-panel-id="panel-outlook-compose" id="nav-outlook-compose-tab" role="tab" title="{{outlook.subtabs.composeTitle}}" type="button">
        <i class="bi bi-pencil-square text-success"></i>
        <span data-i18n="ui.outlook.txt_compose" id="outlook-span-compose">{{ui.outlook.txt_compose}}</span>
      </button>
    </li>
  </ul>

  <div class="tab-content" id="outlookTabContent">
    <!-- ПАНЕЛЬ 1: Входящие письма -->
    <div class="tab-pane fade show active" id="tab-pane-outlook-inbox" role="tabpanel">
      <div class="card shadow-sm border mb-3">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="table-outlook-messages">
              <thead class="table-light">
                <tr>
                  <th scope="col" style="width: 25%;" data-i18n="ui.outlook.txt_col_from" id="outlook-th-from">{{ui.outlook.txt_col_from}}</th>
                  <th scope="col" data-i18n="ui.outlook.txt_col_subject" id="outlook-th-subject">{{ui.outlook.txt_col_subject}}</th>
                  <th scope="col" style="width: 20%;" data-i18n="ui.outlook.txt_col_date" id="outlook-th-date">{{ui.outlook.txt_col_date}}</th>
                </tr>
              </thead>
              <tbody id="outlook-messages-tbody">
                <tr>
                  <td colspan="3" class="text-center py-4 text-secondary">
                    <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                    <div class="small" data-i18n="ui.outlook.txt_loading" id="outlook-div-loading">{{ui.outlook.txt_loading}}</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ПАНЕЛЬ 2: Написать письмо -->
    <div class="tab-pane fade" id="tab-pane-outlook-compose" role="tabpanel">
      <div class="card shadow-sm border">
        <div class="card-body p-3">
          <div id="outlook-compose-alert"></div>
          <form id="form-outlook-compose">
            <div class="mb-3">
              <label class="form-label small fw-bold" for="outlook-compose-to" data-i18n="ui.outlook.txt_label_to" id="outlook-lbl-to">{{ui.outlook.txt_label_to}}</label>
              <input class="form-control form-control-sm" id="outlook-compose-to" type="email" placeholder="colleague@company.com" required />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold" for="outlook-compose-subject" data-i18n="ui.outlook.txt_label_subject" id="outlook-lbl-subject">{{ui.outlook.txt_label_subject}}</label>
              <input class="form-control form-control-sm" id="outlook-compose-subject" type="text" placeholder="Тема сообщения" required />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold" for="outlook-compose-body" data-i18n="ui.outlook.txt_label_body" id="outlook-lbl-body">{{ui.outlook.txt_label_body}}</label>
              <textarea class="form-control form-control-sm" id="outlook-compose-body" rows="6" placeholder="Текст сообщения..." required></textarea>
            </div>
            <div class="d-flex align-items-center justify-content-end gap-2">
              <button class="btn btn-sm btn-primary d-flex align-items-center gap-1.5" id="btn-outlook-send" type="submit">
                <i class="bi bi-send"></i>
                <span data-i18n="ui.outlook.txt_btn_send" id="outlook-span-send">{{ui.outlook.txt_btn_send}}</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
